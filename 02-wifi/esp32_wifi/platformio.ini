[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
; la app web se embebe sola en el build — editar pagina.html y compilar
board_build.embed_txtfiles = pagina.html
monitor_speed = 115200
lib_deps = 
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature@^3.11.0

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
; la app web se embebe sola en el build — editar pagina.html y compilar
board_build.embed_txtfiles = pagina.html
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
lib_deps = 
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature@^3.11.0
